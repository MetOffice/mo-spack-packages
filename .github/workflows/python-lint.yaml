---
name: Python Lint

on:
    push:
        branches:
            - main
            - v*.*

    pull_request:
        branches:
            - main
            - v*.*

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: astral-sh/ruff-action@v4.0.0
            - run: ruff format --check --diff
